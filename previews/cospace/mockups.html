        <div class="cs-hero-copy"><p class="cs-eyebrow">Work independently. Feel connected.</p><p class="cs-display">Find your focus.<br />Find your people.</p><div class="cs-hero-tags"><span>In person</span><span>Online</span></div></div>
        <div class="cs-hero-phones" aria-label="CoSpace mobile interface showcase">
          <div class="cs-phone cs-hero-phone cs-hero-phone--left"><img class="cs-hardware" src="assets/mockups/graphite-device.png" width="887" height="1774" alt="" /><img class="cs-screen" src="assets/screens/nearby.png" width="402" height="874" alt="CoSpace nearby coworking map with session locations and a Host Session action" /></div>
          <div class="cs-phone cs-hero-phone cs-hero-phone--right"><img class="cs-hardware" src="assets/mockups/graphite-device.png" width="887" height="1774" alt="" /><img class="cs-screen" src="assets/screens/virtual.png" width="402" height="874" alt="Virtual coworking room with a shared focus timer, participants, and call controls" /></div>

        </div>

      </figure>

        <figure class="cs-feature cs-feature--virtual"><figcaption><span class="cs-eyebrow">Join online</span><h3>Bring a little company<br />to your focus time.</h3><p>A shared timer and visible participants keep the room centred on working alongside others.</p></figcaption><div class="cs-phone cs-phone-button"><img class="cs-hardware" src="assets/mockups/graphite-device.png" width="887" height="1774" alt="" /><img class="cs-screen" src="assets/screens/virtual.png" width="402" height="874" alt="Virtual room with Ethan Cole, a focus timer, participants, and call controls" /></div></figure>

          <figure><div class="cs-phone cs-phone-button"><img class="cs-hardware" src="assets/mockups/graphite-device.png" width="887" height="1774" alt="" /><img class="cs-screen" src="assets/screens/review.png" width="402" height="874" alt="Editable summary showing the session location, time, group size, and verification choices" /></div><figcaption><span>02</span> Clear expectations</figcaption></figure>
          <figure><div class="cs-phone cs-phone-button"><img class="cs-hardware" src="assets/mockups/graphite-device.png" width="887" height="1774" alt="" /><img class="cs-screen" src="assets/screens/focus.png" width="402" height="874" alt="In-person session focus timer and personal goal list" /></div><figcaption><span>03</span> A shared rhythm</figcaption></figure>
